# ABD UNI PROJECT — Nginx prod — Cloudflare + WAF + 20/s + wss proxy — B.11 F-02/F-10/F-14 — Arena
# web = nginx (spec web) — only public 80/443 — Reverb wss via /reverb proxy to reverb:8080 — no host 8080 expose
user nginx; worker_processes auto; pid /var/run/nginx.pid;
events { worker_connections 4096; }
http {
 include /etc/nginx/mime.types; default_type application/octet-stream;
 log_format json_combined escape=json '{"ts":"$time_iso8601","ip":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"dur":$request_time,"trace":"$http_traceparent"}';
 access_log /var/log/nginx/access.log json_combined; error_log /var/log/nginx/error.log warn;
 # — Cloudflare real IP — (B11 F-02) —
 set_real_ip_from 173.245.48.0/20; set_real_ip_from 103.21.244.0/22; set_real_ip_from 103.22.200.0/22;
 set_real_ip_from 103.31.4.0/22; set_real_ip_from 141.101.64.0/18; set_real_ip_from 108.162.192.0/18;
 set_real_ip_from 190.93.240.0/20; set_real_ip_from 188.114.96.0/20; set_real_ip_from 197.234.240.0/22;
 real_ip_header CF-Connecting-IP; real_ip_recursive on;
 # — Rate limiting 20r/s per IP strict (Pillar 10) —
 limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
 limit_req_status 429; limit_conn_zone $binary_remote_addr zone=conn:10m;
 # — wss upgrade map —
 map $http_upgrade $connection_upgrade { default upgrade; '' close; }
 # — upstream app php-fpm via fastcgi or proxy (app:9000) —
 upstream app { server app:9000; }
 upstream reverb { server reverb:8080; }
 server {
  listen 80; listen 443 ssl http2; # certs mounted at /etc/nginx/certs
  server_name _;
  # ssl_certificate /etc/nginx/certs/fullchain.pem; ssl_certificate_key /etc/nginx/certs/privkey.pem; # enable prod TLS
  # graceful drain
  worker_shutdown_timeout 30s;
  # security headers
  add_header X-Frame-Options DENY always; add_header X-Content-Type-Options nosniff always;
  # health
  location = /health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  # Reverb wss proxy — BROADCAST_PORT — wss://{domain}/reverb or :8080 via web
  location /reverb/ { proxy_pass http://reverb/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 86400; }
  location = /app/reverb { proxy_pass http://reverb:8080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }
  # Alternative direct 8080 wss via web (spec wss://{domain}:8080) — web listens 8080 mapped internally
  # n8n webhook proxy (isolated sandbox needs front ingress F-18)
  location /n8n/ { proxy_pass http://n8n:5678/; proxy_set_header Host $host; }
  # Laravel app
  location / {
   limit_req zone=api burst=40 nodelay; limit_conn conn 50;
   try_files $uri $uri/ /index.php?$query_string;
  }
  location ~ \.php$ { fastcgi_pass app; fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name; include fastcgi_params; fastcgi_read_timeout 30s; }
 }
}
