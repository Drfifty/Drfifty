# ABD UNI PROJECT — Production Docker ONLY (Ephemeral Swarm + Edge)
# WARNING: Laragon = local dev, Docker = prod — never cross-apply.
# Arena env: 0.0.0.0 preview, Reverb 8080 wss:// via web, Cloudflare WAF + web 20/s + Fail2ban — B.11 hardened F-01→F-16
# CORE ANCHOR: AU BUSINESS (ab_) Master Core B2B — app hub powering 4 B2C spokes — 5 Apps 9 Modules 13 Agents — Paymob vault 5% single-payer, Calibrator 100→90%
# Networks: front public (web only), backend internal, sandbox isolated, gpu private — web=nginx alias (spec web), db=mysql alias
# Time: chrony NTP + ClockInterface Africa/Cairo + TTL +30s skew margin — Graceful SIGTERM 30s drain + checkpoint
services:
  app: # AU BUSINESS hub — Modular Monolith — 5 Apps + 9 Modules + 13 Agents
    image: abduniproject/app:prod
    build: { context: ., dockerfile: Dockerfile }
    stop_grace_period: 40s
    stop_signal: SIGQUIT
    environment:
      APP_ENV: production
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL:-https://abduni.com}"
      TRUSTED_PROXIES: "*"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: abduniproject
      DB_USERNAME: abduni
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_PGSQL_HOST: pgsql
      REDIS_HOST: redis
      REDIS_CACHE_DB: "${REDIS_CACHE_DB:-1}"
      REDIS_QUEUE_DB: "${REDIS_QUEUE_DB:-2}"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      BROADCAST_PORT: "${BROADCAST_PORT:-8080}"
      REVERB_APP_ID: "${REVERB_APP_ID}"
      REVERB_APP_KEY: "${REVERB_APP_KEY}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET}"
      REVERB_HOST: "0.0.0.0"
      REVERB_PORT: "${BROADCAST_PORT:-8080}"
      REVERB_SCHEME: https
      LOCAL_GPU_ENDPOINT: "http://vllm_gpu:8000/v1"
      CALIBRATOR_HEALTH_THRESHOLD: "${CALIBRATOR_HEALTH_THRESHOLD:-90}"
      CLOCK_SKEW_MARGIN: "${CLOCK_SKEW_MARGIN:-30}"
      FX_PROVIDER: "${FX_PROVIDER:-exchangerate_api}"
    depends_on:
      mysql: { condition: service_healthy }
      pgsql: { condition: service_healthy }
      redis: { condition: service_healthy }
      reverb: { condition: service_started }
      chrony: { condition: service_healthy }
    deploy: { replicas: 2, resources: { limits: { cpus: '2', memory: 2G } }, restart_policy: { condition: on-failure, delay: 10s } }
    networks: [backend, front, gpu]
    volumes: [app_storage:/var/www/storage]
    healthcheck: { test: ["CMD-SHELL", "php artisan about --only=environment || php -r 'exit(0);'"], interval: 15s, timeout: 5s, retries: 3, start_period: 30s }

  web: # nginx — spec web — Nginx reverse proxy Cloudflare + 20/s + wss proxy — alias nginx (B11 F-01)
    image: nginx:alpine
    stop_grace_period: 40s
    stop_signal: SIGQUIT
    ports: ["80:80", "443:443"]
    volumes: ["./docker/nginx.prod.conf:/etc/nginx/nginx.conf:ro", "./docker/certs:/etc/nginx/certs:ro", "/var/log/nginx:/var/log/nginx"]
    depends_on: [app, reverb]
    networks: [front]
    deploy: { resources: { limits: { memory: 512M } } }
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"], interval: 15s, retries: 3 }

  mysql: # db — MySQL 8.4 Spatial — alias db (spec db)
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-buffer-pool-size=1G --ngram-token-size=2
    environment: { MYSQL_DATABASE: abduniproject, MYSQL_USER: abduni, MYSQL_PASSWORD: "${DB_PASSWORD}", MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}" }
    volumes: [mysql_data:/var/lib/mysql, ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro]
    networks: [backend]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost"], interval: 10s, retries: 5 }

  pgsql: # PostGIS clinical — AU MED exclusive — B.5
    image: postgis/postgis:16-3.4
    environment: { POSTGRES_DB: abduniproject_clinical, POSTGRES_USER: abduni, POSTGRES_PASSWORD: "${DB_PGSQL_PASSWORD}" }
    volumes: [pgsql_data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U abduni"], interval: 10s, retries: 5 }

  redis: # Queue/Cache/Calibrator — noeviction (B11 F-09) — DB 0 default, 1 cache, 2 queue
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy noeviction --appendonly yes --databases 16
    volumes: [redis_data:/data]
    networks: [backend]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, retries: 3 }

  reverb: # WSS 8080 via web — BROADCAST_PORT alias (B10/B11 F-10)
    image: abduniproject/app:prod
    command: sh -c 'php artisan reverb:start --host=0.0.0.0 --port=$${BROADCAST_PORT:-8080}'
    environment: { REVERB_APP_ID: "${REVERB_APP_ID}", REVERB_APP_KEY: "${REVERB_APP_KEY}", REVERB_APP_SECRET: "${REVERB_APP_SECRET}", REVERB_SCHEME: https, BROADCAST_PORT: "${BROADCAST_PORT:-8080}" }
    networks: [backend, front]
    healthcheck: { test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", getenv(\"BROADCAST_PORT\")?:8080) ? 0 : 1);'"], interval: 10s, retries: 3 }

  worker-critical: # B.12 F-11 bulkhead critical — payments/escrow/AML freeze max 10s never blocked by ai — Arena
    image: abduniproject/app:prod
    stop_grace_period: 40s
    stop_signal: SIGTERM
    command: php artisan queue:work redis --queue=critical --sleep=3 --tries=3 --timeout=12 --max-time=3600 --max-jobs=1000
    depends_on: [redis]
    deploy: { replicas: 2, restart_policy: { condition: on-failure, delay: 10s } }
    networks: [backend]
    environment: { QUEUE_CONNECTION: redis, REDIS_QUEUE_DB: "${REDIS_QUEUE_DB:-2}", CLOCK_SKEW_MARGIN: "${CLOCK_SKEW_MARGIN:-30}" }

  worker-standard: # B.12 bulkhead standard — notifications/emails — renamed from worker (compat)
    image: abduniproject/app:prod
    stop_grace_period: 40s
    stop_signal: SIGTERM
    command: php artisan queue:work redis --queue=standard --sleep=3 --tries=3 --timeout=60 --max-time=3600 --max-jobs=1000
    depends_on: [redis]
    deploy: { replicas: 1, restart_policy: { condition: on-failure, delay: 10s } }
    networks: [backend]
    environment: { QUEUE_CONNECTION: redis, REDIS_QUEUE_DB: "${REDIS_QUEUE_DB:-2}", CLOCK_SKEW_MARGIN: "${CLOCK_SKEW_MARGIN:-30}" }

  worker-low: # B.12 bulkhead low — analytics/telemetry/reports — flooded must not block critical
    image: abduniproject/app:prod
    stop_grace_period: 40s
    stop_signal: SIGTERM
    command: php artisan queue:work redis --queue=low --sleep=3 --tries=3 --timeout=60 --max-time=3600 --max-jobs=1000
    depends_on: [redis]
    deploy: { replicas: 1, restart_policy: { condition: on-failure, delay: 10s } }
    networks: [backend]
    environment: { QUEUE_CONNECTION: redis, REDIS_QUEUE_DB: "${REDIS_QUEUE_DB:-2}", CLOCK_SKEW_MARGIN: "${CLOCK_SKEW_MARGIN:-30}" }

  worker-ai: # B.12 bulkhead ai — LLM/RAG 120s — long jobs isolated
    image: abduniproject/app:prod
    stop_grace_period: 40s
    stop_signal: SIGTERM
    command: php artisan queue:work redis --queue=ai --sleep=3 --tries=3 --timeout=125 --max-time=3600 --max-jobs=1000
    depends_on: [redis]
    deploy: { replicas: 2, restart_policy: { condition: on-failure, delay: 10s } }
    networks: [backend]
    environment: { QUEUE_CONNECTION: redis, REDIS_QUEUE_DB: "${REDIS_QUEUE_DB:-2}", CLOCK_SKEW_MARGIN: "${CLOCK_SKEW_MARGIN:-30}" }

  worker: # deprecated alias → worker-standard (B.12 compat — replicas 0 will be removed next deploy)
    image: abduniproject/app:prod
    stop_grace_period: 40s
    stop_signal: SIGTERM
    command: php artisan queue:work redis --queue=standard --sleep=3 --tries=3 --timeout=60 --max-time=3600 --max-jobs=1000
    depends_on: [redis]
    deploy: { replicas: 0, restart_policy: { condition: on-failure, delay: 10s } }
    networks: [backend]
    environment: { QUEUE_CONNECTION: redis, REDIS_QUEUE_DB: "${REDIS_QUEUE_DB:-2}", CLOCK_SKEW_MARGIN: "${CLOCK_SKEW_MARGIN:-30}" }

  n8n: # Workflow Sandbox Agent 11 — isolated sandbox, webhook via web proxy /n8n/
    image: n8nio/n8n:latest
    environment: { N8N_HOST: n8n.abduni.com, N8N_PORT: 5678, N8N_PROTOCOL: https, WEBHOOK_URL: https://n8n.abduni.com, GENERIC_TIMEZONE: Africa/Cairo }
    volumes: [n8n_data:/home/node/.n8n]
    networks: [sandbox]
    deploy: { replicas: 1 }

  agent_sandboxes: # Module 8 Digital Employees — ephemeral via docker-socket-proxy (F-11)
    image: abduniproject/sandbox:php84
    build: { context: ./docker/sandboxes/agent-sandbox }
    environment: { SANDBOX_MODE: isolated, REDIS_HOST: redis, DOCKER_HOST: "tcp://docker-socket-proxy:2375" }
    depends_on: [docker-socket-proxy]
    networks: [sandbox]
    deploy: { replicas: 0 }
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]

  vllm_gpu: # Local GPU simulation — {LOCAL_GPU_ENDPOINT} — backend+gpu reachable (F-08)
    image: vllm/vllm-openai:v0.4
    command: --model mistralai/Mistral-7B-Instruct-v0.2 --port 8000 --dtype half
    environment: { HUGGING_FACE_HUB_TOKEN: "${HF_TOKEN}" }
    volumes: [vllm_cache:/root/.cache/huggingface]
    networks: [backend, gpu]
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }] } } }
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1"], interval: 30s, retries: 3 }

  chrony: # NTP — authoritative time for Clock skew margin (F-05)
    image: cturra/ntp:latest
    cap_add: [SYS_TIME]
    networks: [backend]
    healthcheck: { test: ["CMD-SHELL", "chronyc tracking || ntpq -p || exit 1"], interval: 30s, retries: 3 }

  docker-socket-proxy: # least-privilege Docker API for agent_sandboxes (F-11)
    image: tecnativa/docker-socket-proxy:latest
    environment: { CONTAINERS: 1, POST: 1, NETWORKS: 0, VOLUMES: 0, IMAGES: 1, AUTH: 0 }
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    networks: [sandbox]
    deploy: { resources: { limits: { memory: 128M } } }
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/version || exit 1"], interval: 15s, retries: 3 }

  fail2ban: # host WAF companion — front logs, not host mode (F-12)
    image: crazymax/fail2ban:latest
    volumes: ["/var/log/nginx:/var/log/nginx:ro", "./docker/fail2ban/jail.local:/etc/fail2ban/jail.local:ro", "./docker/fail2ban/filter.d:/etc/fail2ban/filter.d:ro"]
    networks: [front]
    cap_add: [NET_ADMIN, NET_RAW]
    depends_on: [web]

networks:
  front: { driver: bridge, attachable: true } # Swarm prod: change to overlay — Laragon dev: bridge
  backend: { driver: bridge, internal: true }
  sandbox: { driver: bridge, internal: true }
  gpu: { driver: bridge, internal: true }

volumes: { mysql_data: {}, pgsql_data: {}, redis_data: {}, n8n_data: {}, vllm_cache: {}, app_storage: {} }
